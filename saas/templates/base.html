<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #2ea44f;
      --accent-h: #3fb863;
      --border: #30363d;
      --max: 720px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg);
    }
    a { color: var(--accent-h); }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 48px 20px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    header h1 { font-size: 22px; margin: 0; }
    .badge {
      display: inline-block; background: var(--panel); border: 1px solid var(--border);
      border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted);
    }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; margin: 16px 0;
    }
    .btn {
      display: inline-block; background: var(--accent); color: white; border: 0;
      padding: 14px 22px; border-radius: 8px; font-size: 16px; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    .btn:hover { background: var(--accent-h); }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--fg); }
    .muted { color: var(--muted); }
    h2 { margin-top: 32px; }
    code { background: #1f242c; padding: 1px 6px; border-radius: 4px; font-size: 90%; }
    footer { margin-top: 64px; color: var(--muted); font-size: 13px; text-align: center; }
    footer a { color: var(--muted); margin: 0 8px; }
    ul { padding-left: 20px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
  </style>
  {% if posthog_key %}
  <script>
    !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.async=!0,p.src=s.api_host+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="capture identify alias people.set people.set_once set_config register register_once unregister opt_out_capturing has_opted_out_capturing opt_in_capturing reset isFeatureEnabled onFeatureFlags getFeatureFlag getFeatureFlagPayload reloadFeatureFlags group updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures getActiveMatchingSurveys getSurveys".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
    posthog.init('{{ posthog_key }}', { api_host: '{{ posthog_host }}' });
  </script>
  {% endif %}
</head>
<body>
  <div class="wrap">
    <header>
      <h1>♞ {{ app_name }}</h1>
      <span class="badge">for Discord</span>
    </header>
    {% block content %}{% endblock %}
    <footer>
      <a href="/">Home</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
      · <a href="mailto:{{ support_email }}">{{ support_email }}</a>
    </footer>
  </div>
</body>
</html>
