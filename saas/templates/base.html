<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/static/chessbrain-logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/static/chessbrain-logo.png" type="image/png">
  <meta name="theme-color" content="#A50256">
  <meta property="og:title" content="Chess Brain — AI Chess Coach for Discord">
  <meta property="og:description" content="Chess Brain dissects every Lichess game you play and delivers engine-verified analysis straight to your Discord. $5/mo.">
  <meta property="og:image" content="/static/chessbrain-logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="/static/chessbrain-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;          /* clean white */
      --bg-2: #fff0f6;        /* faint pink wash */
      --panel: #ffffff;
      --fg: #0a0a0a;          /* near-black */
      --muted: #5b5b5b;
      --accent: #A50256;      /* deep magenta */
      --accent-h: #FF5FA7;    /* hot pink */
      --accent-d: #6e0039;    /* darker magenta for borders */
      --border: #f0c4dc;      /* soft pink */
      --border-strong: #A50256;
      --danger: #b00020;
      --max: 880px;
      --shadow-sm: 0 1px 0 rgba(165,2,86,0.06);
      --shadow-md: 0 2px 10px rgba(165,2,86,0.08);
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      margin: 0;
      font: 16px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse at top, rgba(255,95,167,0.12), transparent 60%),
        var(--bg);
      min-height: 100vh;
    }
    h1, h2, h3, h4 {
      font-family: "Libre Caslon Text", Georgia, "Times New Roman", serif;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #111;
    }
    h1 { font-size: 28px; }
    h2 { font-size: 24px; margin-top: 28px; }
    h3 { font-size: 19px; }
    a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    a:hover { color: var(--accent-h); }
    code {
      background: var(--bg-2);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 90%;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    }
    ul { padding-left: 20px; }
    ul li { margin: 4px 0; }

    /* layout */
    .wrap { max-width: var(--max); margin: 0 auto; padding: 28px 20px 64px; }

    /* header / marketplace bar */
    .topbar {
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      box-shadow: var(--shadow-sm);
    }
    .topbar-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: var(--fg);
    }
    .brand img {
      width: 38px; height: 38px; display: block;
    }
    .brand-name {
      font-family: "Libre Caslon Text", Georgia, serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand-name em {
      font-style: italic; color: var(--accent);
    }
    .badge {
      display: inline-block;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }
    .topbar-spacer { flex: 1; }
    .topbar-link {
      font-size: 13px; color: var(--muted); text-decoration: none;
      letter-spacing: 0.4px; text-transform: uppercase;
    }
    .topbar-link:hover { color: var(--accent); }

    /* panels / listing cards */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px 26px;
      margin: 18px 0;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .panel.featured::before {
      content: "";
      position: absolute; left: -1px; right: -1px; top: -1px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-d), var(--accent), var(--accent-h));
      border-top-left-radius: 8px; border-top-right-radius: 8px;
    }
    .panel h2:first-child, .panel h3:first-child { margin-top: 0; }

    /* buttons */
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent-d);
      padding: 12px 22px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: background 120ms ease, transform 60ms ease;
    }
    .btn:hover { background: var(--accent-h); color: #fff; }
    .btn:active { transform: translateY(1px); }
    .btn.secondary {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border-strong);
      box-shadow: none;
    }
    .btn.secondary:hover { background: var(--bg-2); color: var(--fg); }
    .btn.large { padding: 16px 28px; font-size: 15px; }

    .muted { color: var(--muted); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .center { text-align: center; }

    /* hero */
    .hero { text-align: center; padding: 36px 26px 30px; }
    .hero img.logo { width: 110px; height: 110px; margin: 0 auto 18px; display: block; }
    .hero h1 {
      font-size: 40px; line-height: 1.15; margin: 0 0 14px;
    }
    .hero .sub {
      max-width: 560px; margin: 0 auto 22px;
      color: var(--muted); font-size: 17px;
    }
    .hero .row { justify-content: center; }
    .hero-tagline {
      display: inline-block;
      font-family: "Libre Caslon Text", Georgia, serif;
      font-style: italic; color: var(--accent);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 4px 18px; margin-bottom: 18px;
      letter-spacing: 1.5px; text-transform: uppercase; font-size: 12px; font-style: normal;
    }

    /* feature grid */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }
    .feature {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 6px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow-sm);
    }
    .feature h3 {
      margin: 0 0 6px; font-size: 17px;
    }
    .feature .tag {
      display: inline-block;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--accent); border: 1px solid var(--accent);
      padding: 1px 6px; border-radius: 3px; margin-bottom: 8px;
    }
    .feature p { margin: 0; color: var(--muted); font-size: 14px; }

    /* gif placeholders */
    .gif-strip { display: grid; gap: 14px; margin-top: 12px; }
    .gif-strip figure {
      margin: 0;
      border: 1px dashed var(--border-strong);
      background: var(--bg-2);
      border-radius: 6px;
      overflow: hidden;
    }
    .placeholder-gif {
      aspect-ratio: 16 / 9;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      font-family: "Libre Caslon Text", Georgia, serif;
      font-style: italic;
      font-size: 15px;
      background:
        repeating-linear-gradient(
          45deg,
          rgba(165,2,86,0.06) 0 10px,
          transparent 10px 20px
        );
    }
    .gif-strip figcaption {
      padding: 8px 14px;
      font-size: 13px; color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    /* pricing */
    .pricing-card {
      max-width: 420px; margin: 24px auto 0;
      text-align: center;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--panel);
      padding: 26px 24px;
      box-shadow: var(--shadow-md);
    }
    .pricing-card .price {
      font-family: "Libre Caslon Text", Georgia, serif;
      font-size: 42px; font-weight: 700; line-height: 1; margin: 6px 0 4px;
    }
    .pricing-card .price small {
      font-size: 16px; font-weight: 400; color: var(--muted);
    }
    .pricing-card ul {
      list-style: none; padding: 0; margin: 16px 0 18px;
      text-align: left;
    }
    .pricing-card ul li {
      padding: 6px 0;
      border-bottom: 1px dotted var(--border);
    }
    .pricing-card ul li::before {
      content: "♞ "; color: var(--accent); font-weight: 700;
    }
    .pricing-card ul li:last-child { border-bottom: 0; }

    /* faq */
    .faq details {
      border-bottom: 1px solid var(--border);
      padding: 12px 4px;
    }
    .faq details:last-child { border-bottom: 0; }
    .faq summary {
      cursor: pointer;
      font-family: "Libre Caslon Text", Georgia, serif;
      font-weight: 700; font-size: 17px;
      list-style: none;
      display: flex; justify-content: space-between; align-items: center;
    }
    .faq summary::-webkit-details-marker { display: none; }
    .faq summary::after {
      content: "＋"; color: var(--accent); font-weight: 700;
      transition: transform 120ms ease;
    }
    .faq details[open] summary::after { content: "－"; }
    .faq p { color: var(--muted); margin: 8px 0 4px; }

    /* how-it-works */
    .steps { counter-reset: step; list-style: none; padding: 0; margin: 0; }
    .steps li {
      counter-increment: step;
      padding: 10px 0 10px 44px;
      position: relative;
      border-bottom: 1px dotted var(--border);
    }
    .steps li:last-child { border-bottom: 0; }
    .steps li::before {
      content: counter(step, upper-roman) ".";
      position: absolute; left: 0; top: 8px;
      font-family: "Libre Caslon Text", Georgia, serif;
      font-weight: 700; color: var(--accent);
      font-size: 18px;
    }

    /* footer */
    footer {
      margin-top: 56px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    footer .est {
      font-family: "Libre Caslon Text", Georgia, serif;
      font-style: italic;
      display: block;
      margin-bottom: 6px;
    }
    footer a { color: var(--muted); margin: 0 8px; }
    footer a:hover { color: var(--accent); }

    /* responsive */
    @media (max-width: 620px) {
      .hero h1 { font-size: 30px; }
      .feature-grid { grid-template-columns: 1fr; }
      .panel { padding: 20px; }
      .topbar-inner { padding: 12px 16px; }
      .brand-name { font-size: 18px; }
      .badge { display: none; }
    }
  </style>
  {% if posthog_key %}
  <script>
    !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.async=!0,p.src=s.api_host+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="capture identify alias people.set people.set_once set_config register register_once unregister opt_out_capturing has_opted_out_capturing opt_in_capturing reset isFeatureEnabled onFeatureFlags getFeatureFlag getFeatureFlagPayload reloadFeatureFlags group updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures getActiveMatchingSurveys getSurveys".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);

  {% endif %}
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <img src="/static/chessbrain-logo.png" alt="Chess Brain logo">
        <span class="brand-name">Chess <em>Brain</em></span>
      </a>
      <span class="badge">AI Chess Brain · Discord</span>
      <span class="topbar-spacer"></span>
      <a class="topbar-link" href="https://github.com/charlesbueso/lichess-ai-coach" target="_blank" rel="noopener noreferrer">Source</a>
    </div>
  </div>
  <div class="wrap">
    {% block content %}{% endblock %}
    <footer>
      <span class="est">Chess Brain · est. MMXXVI · open source</span>
      <a href="/">Home</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
      · <a href="mailto:{{ support_email }}">{{ support_email }}</a>
      <p style="margin:8px 0 0;font-size:12px;">Not affiliated with, endorsed by, or sponsored by Lichess or the lichess.org team.</p>
    </footer>
  </div>
</body>
</html>
